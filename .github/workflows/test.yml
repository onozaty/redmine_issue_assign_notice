name: Test

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

jobs:
  test:
    name: Redmine ${{ matrix.redmine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redmine: ['4.0', '4.1', '4.2', '5.0', '5.1', '6.0', '6.1', '7.0']
    container:
      image: redmine:${{ matrix.redmine }}
    env:
      RAILS_ENV: test
      # The official image installs gems without the development and test groups.
      BUNDLE_WITHOUT: development
    defaults:
      run:
        working-directory: /usr/src/redmine
    steps:
      - uses: actions/checkout@v4
        with:
          path: redmine_issue_assign_notice

      - name: Install build tools
        run: |
          # Old images are based on Debian releases that have moved to archive.debian.org.
          if ! (apt-get update && apt-get install -y build-essential); then
            find /etc/apt -name '*.list' -o -name '*.sources' | xargs sed -i \
              -e 's|deb.debian.org|archive.debian.org|g' \
              -e 's|security.debian.org|archive.debian.org|g' \
              -e '/-updates/d'
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y build-essential
          fi

      - name: Set up Redmine
        run: |
          cp -r "$GITHUB_WORKSPACE/redmine_issue_assign_notice" plugins/
          cat > config/database.yml <<'EOF'
          test:
            adapter: sqlite3
            database: db/test.sqlite3
          EOF
          # The image's bundler config takes precedence over BUNDLE_WITHOUT, so remove it.
          sed -i '/^BUNDLE_WITHOUT:/d' "$BUNDLE_APP_CONFIG/config"
          bundle install
          bundle exec rake generate_secret_token
          bundle exec rake db:migrate redmine:plugins:migrate

      - name: Run tests
        run: bundle exec rake redmine:plugins:test NAME=redmine_issue_assign_notice
